<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>FlapyCopa - Jogando</title>
    <link rel="icon" href="/flapycopa/vendor/flagcdn/w40/br.png" type="image/png"/>
        <link href="/flapycopa/vendor/fonts/poppins.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #0e1e2f 0%, #03080e 70%);
            font-family: 'Poppins', sans-serif;
            color: #fff;
            overflow: hidden;
            --map-c1: #22c55e;
            --map-c2: #0c1c2e;
            --map-c3: #22c55e99;
            --map-c1-rgb: 34, 197, 94;
        }
        .game-shell {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            background: #000;
            box-shadow: 0 25px 60px rgba(0,0,0,.8);
        }
        @media (min-width: 480px) {
            .game-shell {
                max-width: 460px;
                height: 820px;
                max-height: calc(100vh - 40px);
                border-radius: 36px;
                border: 6px solid #14283f;
                box-shadow: 0 0 0 4px #0c1826, 0 30px 70px rgba(0,0,0,.9);
            }
        }
        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 100%);
        }
        .top-bar .map-pill { display: none; } /* Remover botÃ£o do paÃ­s do topo */
        .top-btn {
            width: 42px; height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1.5px solid rgba(255,255,255,.12);
            display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #000, 0 8px 15px rgba(0,0,0,.3);
            transition: all .15s ease;
        }
        .top-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }

        .map-pill {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; font-weight: 900;
            background: linear-gradient(180deg, #1e293b, #0f172a);
            border: 1.5px solid rgba(255,255,255,.12);
            border-radius: 12px;
            padding: 8px 18px;
            box-shadow: 0 4px 0 #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .map-pill img { width: 18px; height: 12px; object-fit: cover; border-radius: 2px; }

        .balance-pill {
            display: flex; flex-direction: column; align-items: flex-end;
            background: linear-gradient(135deg, #0f172a, #020617);
            border: 1.5px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 6px 14px;
            box-shadow: 0 4px 0 #1e3a8a, 0 10px 20px rgba(59, 130, 246, 0.15);
        }
        .balance-pill span:first-child { font-size: 8px; font-weight: 900; color: #60a5fa; letter-spacing: 1px; }
        #saldo-display { font-size: 15px; font-weight: 900; color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.3); }

        canvas#game-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: block;
            touch-action: manipulation;
        }

        .screen {
            position: absolute;
            inset: 0;
            z-index: 40;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: linear-gradient(180deg, rgba(3,8,14,.55) 0%, rgba(3,8,14,.85) 100%);
        }
        .hidden { display: none !important; }

        .bet-card {
            width: 100%; max-width: 320px;
            background: rgba(10,18,30,.92);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 22px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.6);
        }
        .bird-preview {
            width: 90px; height: 90px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.12) 0%, transparent 70%);
            display: flex; align-items: center; justify-content: center;
        }
        .bird-preview img { width: 80%; height: 80%; object-fit: contain; animation: float 2.2s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .map-name { font-weight: 800; font-size: 15px; margin-bottom: 14px; }
        .saldo-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: rgba(255,255,255,.55); margin-bottom: 4px; }
        .saldo-row b { font-size: 17px; color: #7ed957; display: block; }
        .entrada-label { font-size: 11px; color: rgba(255,255,255,.45); text-align: left; margin: 14px 0 8px; text-transform: uppercase; letter-spacing: .5px; }
        .valores-grid { display: flex; gap: 8px; flex-wrap: wrap; }
        .valor-btn {
            flex: 1 1 28%;
            padding: 12px 0;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.04);
            color: #94a3b8; font-weight: 800; font-size: 14px;
            cursor: pointer; transition: all .15s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,.3);
            position: relative;
        }
        .valor-btn:hover { color: #fff; background: rgba(255,255,255,.08); }
        .valor-btn.active {
            background: linear-gradient(135deg, var(--map-c1), var(--map-c2));
            border-color: rgba(255,255,255,0.2);
            color: #fff;
            box-shadow: 0 5px 0 var(--map-c3, #15803d), 0 10px 20px rgba(0,0,0,.4);
            transform: translateY(-2px);
        }
        .valor-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--map-c3, #15803d); }
        
        .valor-badge {
            position: absolute;
            top: -8px; left: 50%; transform: translateX(-50%);
            padding: 2px 6px; border-radius: 4px;
            font-size: 7px; font-weight: 900; color: #fff;
            background: #ef4444; border: 1px solid #f87171;
            white-space: nowrap; z-index: 5;
        }

        .valor-input-wrap { margin-top: 18px; position: relative; }
        .valor-input-wrap::before {
            content: 'VALOR PERSONALIZADO';
            position: absolute; top: -10px; left: 14px;
            font-size: 8px; font-weight: 900; color: #64748b;
            background: #0a121e; padding: 0 6px;
        }
        .valor-input-wrap input {
            width: 100%; padding: 14px; border-radius: 14px;
            border: 1.5px solid rgba(255,255,255,.12);
            background: rgba(0,0,0,.25);
            color: #fff; font-size: 16px; font-weight: 900; text-align: center;
            outline: none; transition: all .2s;
        }
        .valor-input-wrap input:focus { border-color: var(--map-c1); box-shadow: 0 0 0 4px rgba(var(--map-c1-rgb), 0.15); }
        .meta-box { display: flex; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); margin-top: 14px; }
        .meta-box > div { flex: 1; text-align: center; padding: 9px; background: rgba(255,255,255,.04); }
        .meta-box span.lbl { font-size: 9px; color: rgba(255,255,255,.6); display: block; }
        .meta-box span.val { font-size: 14px; font-weight: 800; color: #ffea00; }
        .bet-error { color: #f87171; font-size: 12px; margin-top: 10px; min-height: 14px; }
        .play-btn {
            width: 100%; margin-top: 14px; padding: 14px 0;
            border-radius: 50px; border: none; cursor: pointer;
            font-size: 15px; font-weight: 900; color: #fff;
            background: linear-gradient(135deg, var(--map-c1), var(--map-c2));
            box-shadow: 0 14px 30px rgba(0,0,0,.4);
        }
        .play-btn:disabled { opacity: .6; cursor: default; }
        .gratis-tag { font-size: 11px; color: #facc15; font-weight: 800; margin-bottom: 8px; }

        .hud {
            position: absolute; top: 0; left: 0; right: 0; z-index: 30;
            padding: 80px 16px 18px; /* Aumentei o padding superior para nÃ£o bater no cabeÃ§alho */
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none;
        }
        .hud .aposta-lbl { font-size: 10px; color: rgba(255,255,255,.6); text-transform: uppercase; }
        .hud .aposta-val { font-size: 14px; font-weight: 800; }
        .hud-center { text-align: center; flex: 1; }
        .hud-ganho { font-size: 26px; font-weight: 900; color: #7ed957; text-shadow: 2px 2px 0 rgba(0,0,0,.4), 0 0 20px rgba(0,0,0,.3); }
        .hud-progress { margin: 6px auto 0; height: 6px; width: 140px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; }
        .hud-progress-bar { height: 100%; background: #facc15; width: 0%; transition: width .2s ease; }

        .hud-meta-wrap {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: none;
        }
        .hud-meta-item {
            background: rgba(10, 18, 30, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 8px;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .hud-meta-lbl { font-size: 8px; font-weight: 900; color: rgba(255,255,255,0.5); text-transform: uppercase; display: block; margin-bottom: 1px; }
        .hud-meta-val { font-size: 11px; font-weight: 900; color: #fff; }
        .hud-meta-val.green { color: #4ade80; }
        .hud-meta-val.yellow { color: #facc15; }

        .cashout-wrap { position: absolute; left: 0; right: 0; bottom: 26px; z-index: 30; display: flex; justify-content: center; }
        .cashout-btn {
            padding: 12px 28px; border-radius: 50px; border: none; cursor: pointer;
            font-weight: 900; font-size: 14px; color: #0c1c2e;
            background: linear-gradient(135deg, #ffea00, #facc15);
            box-shadow: 0 12px 26px rgba(0,0,0,.45);
        }

        .result-card { width: 100%; max-width: 300px; background: rgba(10,18,30,.95); border-radius: 22px; padding: 26px 22px; text-align: center; border: 1px solid rgba(255,255,255,.12); }
        .result-emoji { font-size: 42px; margin-bottom: 6px; }
        .result-title { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
        .result-value { font-size: 26px; font-weight: 900; margin-bottom: 16px; }
        .result-value.win { color: #7ed957; }
        .result-value.lose { color: #f87171; }
        .result-btn { width: 100%; padding: 13px 0; border-radius: 50px; border: none; cursor: pointer; font-weight: 800; font-size: 14px; margin-top: 8px; }
        .result-btn.primary { color: #fff; background: linear-gradient(135deg, var(--map-c1), var(--map-c2)); }
        .result-btn.secondary { color: rgba(255,255,255,.7); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }

        .tap-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 25; opacity: .9; }
        .tap-hint span { background: rgba(0,0,0,.45); padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    </style>
</head>
<body style="--map-c1: #22c55e; --map-c2: #22c55e;">
    <div class="game-shell" id="shell" style="--map-c1: #22c55e; --map-c2: #0c1c2e;">
        <canvas id="game-canvas"></canvas>

        <div class="top-bar">
            <a href="/flapycopa/" class="top-btn" aria-label="Voltar">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div class="map-pill">
                <img src="/flapycopa/vendor/flagcdn/w40/br.png" alt="Bandeira">
                <span>Brasil</span>
            </div>
            <div class="balance-pill">
                <span>OBJETIVO / META</span>
                <span id="saldo-display" style="color: #facc15;">R$ 0,00</span>
            </div>
        </div>

        
        <div class="screen " id="screen-bet">
            <div class="bet-card" style="border-color: var(--map-c1);">
                                <div class="bird-preview" style="background: radial-gradient(circle, rgba(34, 197, 94, 0.2) 0%, transparent 70%);">
                    <img src="/flapycopa/img/flapbird/birds/bird-brasil.png" alt="Brasil" />
                </div>
                <div class="map-name" style="color: var(--map-c1); display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <img src="/flapycopa/vendor/flagcdn/w40/br.png" style="width: 20px; height: 14px; border-radius: 2px;">
                    Brasil
                </div>

                                <div class="saldo-row">
                    <span>Saldo em conta</span>
                </div>
                <b id="bet-saldo" style="font-size: 22px; color: #fff; display: block; margin-bottom: 20px;">R$ 0,00</b>
                
                <div class="entrada-label">Selecione o valor da entrada</div>
                <div class="valores-grid" id="valores-grid"></div>
                
                <div class="valor-input-wrap">
                    <input type="number" id="valor-input" inputmode="decimal" placeholder="0,00" step="0.01" />
                </div>

                <div class="meta-box" style="border-color: rgba(34, 197, 94, 0.2);">
                    <div style="border-right: 1px solid rgba(34, 197, 94, 0.1);"><span class="lbl">META (2x)</span><span class="val" id="meta-display" style="color: #4ade80;">R$ 0,00</span></div>
                    <div><span class="lbl">POR CANO</span><span class="val" id="cano-display" style="color: #facc15;">R$ 0,00</span></div>
                </div>

                <div class="bet-error" id="bet-error"></div>
                <button class="play-btn" id="btn-jogar" onclick="iniciarPartida()" style="background: linear-gradient(135deg, var(--map-c1), var(--map-c2)); box-shadow: 0 6px 0 var(--map-c3);">
                    JOGAR VALENDO ▶
                </button>
            </div>
        </div>

        
        <div class="hud hidden" id="hud">
            <div>
                <div class="aposta-lbl">Aposta</div>
                <div class="aposta-val" id="hud-aposta">R$ 0,00</div>
            </div>
            <div class="hud-center">
                <div class="hud-ganho" id="hud-ganho">R$ 0,00</div>
                <div class="hud-progress"><div class="hud-progress-bar" id="hud-progress-bar"></div></div>
            </div>
            <div style="width:40px"></div>
        </div>
        <div class="cashout-wrap hidden" id="cashout-wrap">
            <button class="cashout-btn" id="btn-resgatar" onclick="resgatar()">RESGATAR 💰</button>
        </div>
        <div class="tap-hint hidden" id="tap-hint"><span>Toque ou aperte ESPAÇO para voar</span></div>
        
        <div class="screen hidden" id="screen-result">
            <div class="result-card">
                <div class="result-emoji" id="result-emoji">🎉</div>
                <div class="result-title" id="result-title">Você ganhou!</div>
                <div class="result-value win" id="result-value">R$ 0,00</div>
                <button class="result-btn primary" onclick="voltarParaAposta()">JOGAR DE NOVO</button>
                <button class="result-btn secondary" onclick="window.location.href='/flapycopa/'">VOLTAR AO INÍCIO</button>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        const IS_GRATIS = false;
        const MAP_ID = "brasil";
        const MAP = {"nome":"Brasil","bandeira":"br","bird":"/flapycopa/img/flapbird/birds/bird-brasil.png","cor":"#22c55e","rgb":"34, 197, 94","ceu1":"#4ec0ca","ceu2":"#87ceeb","ceu3":"#ded895","cano1":"#5cb85c","cano2":"#7ed957","cano3":"#4a9e4a","canoTopo":"#6fdc6f","chao":"#6abe30"};
        const CSRF_TOKEN = "XnOykVq0rMzYp2qERiGb9vlYr7s70Easd3JQkHTD";
        const IS_AUTH = false;

        let saldoAtual = 0;
        let valorEscolhido = 10;
        let valoresRapidos = [5, 10, 20, 50, 100];
        let multiplicadorMeta = 2.0;
        let taxaPorCano = 0.25;
        let partidaId = null;
        let valorEntradaAtiva = IS_GRATIS ? 10.00 : 0; // Entrada fixa de R$ 10 no demo

        let physicsConfig = {
            gravity: 1.0,
            speed: 1.0,
            gap: 1.0
        };

        // Valor fixo de ganho por cano no modo DEMO para subir rÃ¡pido
        const GANHO_POR_CANO_DEMO = 5.00; 

        function somAtivo() {
            try { return localStorage.getItem('flappix_som') !== '0'; } catch (e) { return true; }
        }

        function formatMoney(v) {
            return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function apiPost(url, body) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-TOKEN': CSRF_TOKEN },
                body: JSON.stringify(body || {}),
            });
            const data = await res.json().catch(() => ({ success: false, error: 'Resposta invÃ¡lida do servidor.' }));
            return data;
        }

        // ---------- Bet selection screen ----------
        function renderValoresRapidos() {
            const grid = document.getElementById('valores-grid');
            grid.innerHTML = '';
            valoresRapidos.forEach((v) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'valor-btn' + (v === valorEscolhido ? ' active' : '');
                btn.textContent = 'R$' + v;
                btn.onclick = () => { valorEscolhido = v; document.getElementById('valor-input').value = ''; updateMetaPreview(); renderValoresRapidos(); };
                grid.appendChild(btn);
            });
        }

        function currentValor() {
            const raw = document.getElementById('valor-input').value.replace(',', '.').trim();
            if (raw) {
                const parsed = parseFloat(raw);
                if (!isNaN(parsed) && parsed > 0) return parsed;
            }
            return valorEscolhido;
        }

        function updateMetaPreview() {
            const v = currentValor();
            document.getElementById('meta-display').textContent = formatMoney(v * multiplicadorMeta);
            document.getElementById('cano-display').textContent = formatMoney(v * taxaPorCano);
        }

        document.getElementById('valor-input').addEventListener('input', updateMetaPreview);

        async function loadConfigs() {
            try {
                // Passa o parÃ¢metro gratis para a API de configs saber qual fÃ­sica e taxa retornar
                const res = await fetch(`https://flapycopa.tanoclique.com/api/flappybird/configs?gratis=${IS_GRATIS ? 1 : 0}`);
                const data = await res.json();
                if (data.success && data.data) {
                    if (Array.isArray(data.data.entrada_valores_rapidos) && data.data.entrada_valores_rapidos.length) {
                        valoresRapidos = data.data.entrada_valores_rapidos.map(Number);
                        valorEscolhido = valoresRapidos[1] || valoresRapidos[0];
                    }
                    multiplicadorMeta = Number(data.data.multiplicador) || 2.0;
                    taxaPorCano = Number(data.data.taxa_por_cano) || 0.25;

                    // Aplica fÃ­sica baseada no modo retornado pela API
                    const phys = data.data.physics;
                    if (phys) {
                        physicsConfig.gravity = phys.gravity || 1.0;
                        physicsConfig.speed = phys.speed || 1.0;
                        physicsConfig.gap = phys.gap || 1.0;
                    }
                }
            } catch (e) { /* mantÃ©m os valores padrÃ£o */ }
            renderValoresRapidos();
            updateMetaPreview();

            // Se for modo demonstraÃ§Ã£o, inicia direto pulando a tela de aposta
            if (IS_GRATIS) {
                valorEntradaAtiva = 10.00; // Valor fixo visual para o demo
                startGameScreen();
            }
        }

        function setBetError(msg) {
            document.getElementById('bet-error').textContent = msg || '';
        }

        async function iniciarPartida() {
            const valor = currentValor();
            if (isNaN(valor) || valor <= 0) {
                setBetError('Informe um valor vÃ¡lido.');
                return;
            }

            if (IS_GRATIS) {
                valorEntradaAtiva = valor;
                partidaId = null;
                startGameScreen();
                return;
            }

            if (!IS_AUTH) {
                window.location.href = '/flapycopa/';
                return;
            }

            if (valor > saldoAtual) {
                setBetError('Saldo insuficiente para essa aposta.');
                return;
            }

            const btn = document.getElementById('btn-jogar');
            btn.disabled = true;
            setBetError('');

            const res = await apiPost('/api/flappybird/iniciar', { valor_entrada: valor, map_id: MAP_ID });
            btn.disabled = false;

            if (!res.success || !res.data) {
                setBetError(res.error || 'NÃ£o foi possÃ­vel iniciar a partida.');
                return;
            }

            partidaId = res.data.partida_id;
            valorEntradaAtiva = res.data.valor_entrada;
            multiplicadorMeta = Number(res.data.multiplicador_meta) || multiplicadorMeta;
            taxaPorCano = Number(res.data.taxa_por_cano) || taxaPorCano;
            saldoAtual = Number(res.data.saldo_novo);
            updateSaldoDisplays();
            startGameScreen();
        }

        function updateSaldoDisplays() {
            const topEl = document.getElementById('saldo-display');
            const betEl = document.getElementById('bet-saldo');
            if (topEl) topEl.textContent = formatMoney(saldoAtual);
            if (betEl) betEl.textContent = formatMoney(saldoAtual);
        }

        function startGameScreen() {
            document.getElementById('screen-bet').style.display = 'none'; // ForÃ§ar esconder instantaneamente
            document.getElementById('screen-bet').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('tap-hint').classList.remove('hidden');
            const hudAposta = document.getElementById('hud-aposta');
            if (hudAposta) hudAposta.textContent = formatMoney(valorEntradaAtiva);
            
            // Atualizar valor de meta no topo
            const metaValue = IS_GRATIS ? 20.00 : (valorEntradaAtiva * multiplicadorMeta);
            
            // Atualizar a meta no painel do topo
            document.getElementById('saldo-display').textContent = formatMoney(metaValue);

            document.getElementById('hud-ganho').textContent = formatMoney(0);
            document.getElementById('hud-progress-bar').style.width = '0%';
            
            // Esconder botÃ£o de resgate no inÃ­cio
            document.getElementById('cashout-wrap').classList.add('hidden');
            
            Game.start();
        }

        function voltarParaAposta() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-bet').classList.remove('hidden');
            setBetError('');
            updateSaldoDisplays();
        }

        async function resgatar() {
            Game.stop();
            const canos = Game.score;
            const ganho = Math.round(canos * taxaPorCano * valorEntradaAtiva * 100) / 100;

            if (IS_GRATIS) {
                showResult(true, ganho, canos);
                return;
            }

            const res = await apiPost('/api/flappybird/finalizar', {
                partida_id: partidaId,
                canos_passados: canos,
                resgatou: true,
            });

            if (res.success && res.data) {
                saldoAtual = Number(res.data.saldo_novo);
                updateSaldoDisplays();
                showResult(res.data.ganhou !== false, Number(res.data.valor_ganho_ou_perdido) || ganho, canos);
            } else {
                showResult(true, ganho, canos);
            }
        }

        async function gameOver() {
            Game.stop();
            const canos = Game.score;
            playSomQueda();

            if (IS_GRATIS) {
                showResult(false, valorEntradaAtiva, canos);
                return;
            }

            const res = await apiPost('/api/flappybird/finalizar', {
                partida_id: partidaId,
                canos_passados: canos,
                resgatou: false,
            });

            if (res.success && res.data) {
                saldoAtual = Number(res.data.saldo_novo);
                updateSaldoDisplays();
            }
            showResult(false, valorEntradaAtiva, canos);
        }

        function showResult(ganhou, valor, canos) {
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('cashout-wrap').classList.add('hidden');
            document.getElementById('tap-hint').classList.add('hidden');
            document.getElementById('result-emoji').textContent = ganhou ? '🎉' : '💥';
            document.getElementById('result-title').textContent = ganhou
                ? (IS_GRATIS ? 'Meta atingida na Conta Teste!' : 'Você resgatou!')
                : (IS_GRATIS ? 'Fim do jogo demo' : 'Você perdeu a aposta');
            
            const valEl = document.getElementById('result-value');
            valEl.className = 'result-value ' + (ganhou ? 'win' : 'lose');
            
            // No demo, calcula o valor baseado no ganho de 5 em 5 para o resultado final
            const valorFinal = IS_GRATIS ? (canos * GANHO_POR_CANO_DEMO) : valor;
            valEl.textContent = (ganhou ? '+ ' : '- ') + formatMoney(valorFinal) + ' • ' + canos + ' canos';

            document.getElementById('screen-result').classList.remove('hidden');
        }

        // ---------- Sound effects ----------
        let audioCtx = null;
        function getAudioCtx() {
            if (!somAtivo()) return null;
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
            }
            return audioCtx;
        }
        function playSomFlap() {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
            osc.start(); osc.stop(ctx.currentTime + 0.12);
        }
        function playSomPonto() {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
            osc.start(); osc.stop(ctx.currentTime + 0.15);
        }
        function playSomQueda() {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(500, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
            osc.start(); osc.stop(ctx.currentTime + 0.4);
        }

        // ---------- Flappy Bird canvas game ----------
        const Game = (function () {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            let W = 0, H = 0, DPR = 1;
            const birdImg = new Image();
            birdImg.src = MAP.bird;

            // Constantes base (serÃ£o multiplicadas pelas configs do admin)
            const BASE_GRAVITY = 1500;
            const BASE_FLAP_VELOCITY = -380;
            const BASE_PIPE_GAP = 165;
            const BASE_PIPE_SPEED = 145;
            
            let GRAVITY = BASE_GRAVITY;
            let FLAP_VELOCITY = BASE_FLAP_VELOCITY;
            let PIPE_GAP = BASE_PIPE_GAP;
            let PIPE_SPEED = BASE_PIPE_SPEED;

            const PIPE_WIDTH = 70;
            const PIPE_SPACING = 230;
            const BIRD_RADIUS = 16;
            const GROUND_HEIGHT = 70;

            let bird = { x: 0, y: 0, vy: 0, rot: 0 };
            let pipes = [];
            let running = false;
            let lastTime = 0;
            let distanceSinceLastPipe = 0;
            let score = 0;
            let groundOffset = 0;

            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = rect.width; H = rect.height;
                canvas.width = W * DPR;
                canvas.height = H * DPR;
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            }
            window.addEventListener('resize', resize);

            function updatePhysics() {
                GRAVITY = BASE_GRAVITY * physicsConfig.gravity;
                // Ajusta o flap proporcionalmente Ã  gravidade para nÃ£o ficar "pesado" demais
                FLAP_VELOCITY = BASE_FLAP_VELOCITY * Math.sqrt(physicsConfig.gravity);
                
                // Gap (abertura): quanto maior o mult, maior a abertura (mais fÃ¡cil)
                PIPE_GAP = BASE_PIPE_GAP * physicsConfig.gap;
                
                // Speed (velocidade): quanto maior o mult, mais rÃ¡pido
                PIPE_SPEED = BASE_PIPE_SPEED * physicsConfig.speed;
            }

            function reset() {
                updatePhysics();
                bird.x = Math.max(70, W * 0.28);
                bird.y = H / 2;
                bird.vy = 0;
                bird.rot = 0;
                pipes = [];
                distanceSinceLastPipe = 0;
                score = 0;
                groundOffset = 0;
                updateHud();
            }

            function flap() {
                if (!running) return;
                bird.vy = FLAP_VELOCITY;
                playSomFlap();
            }

            function spawnPipe() {
                const minTop = 50;
                const maxTop = H - GROUND_HEIGHT - PIPE_GAP - 50;
                const topHeight = Math.max(minTop, Math.random() * (maxTop - minTop) + minTop);
                pipes.push({ x: W + PIPE_WIDTH, topHeight, passed: false });
            }

            function updateHud() {
                // No demo o ganho sobe de 5 em 5, no real puxa a taxa do admin
                const ganhoPorCano = IS_GRATIS ? GANHO_POR_CANO_DEMO : (taxaPorCano * valorEntradaAtiva);
                const ganhoTotal = Math.round(score * ganhoPorCano * 100) / 100;
                
                document.getElementById('hud-ganho').textContent = formatMoney(ganhoTotal);

                // Atualiza barra de progresso e botÃ£o de resgate
                const targetValue = IS_GRATIS ? 20.00 : (valorEntradaAtiva * multiplicadorMeta);
                const pct = Math.min((ganhoTotal / targetValue) * 100, 100);
                document.getElementById('hud-progress-bar').style.width = pct + '%';

                // Mostrar botÃ£o de resgate apenas se atingir a meta
                const cashoutWrap = document.getElementById('cashout-wrap');
                if (ganhoTotal >= targetValue) {
                    cashoutWrap.classList.remove('hidden');
                } else {
                    cashoutWrap.classList.add('hidden');
                }
            }

            function step(dt) {
                bird.vy += GRAVITY * dt;
                bird.y += bird.vy * dt;
                bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy / 600));

                groundOffset = (groundOffset + PIPE_SPEED * dt) % 40;

                distanceSinceLastPipe += PIPE_SPEED * dt;
                if (distanceSinceLastPipe >= PIPE_SPACING) {
                    distanceSinceLastPipe = 0;
                    spawnPipe();
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    const p = pipes[i];
                    p.x -= PIPE_SPEED * dt;

                    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
                        p.passed = true;
                        score += 1;
                        playSomPonto();
                        updateHud();
                    }

                    if (p.x < -PIPE_WIDTH) pipes.splice(i, 1);
                }

                if (bird.y - BIRD_RADIUS < 0) {
                    bird.y = BIRD_RADIUS;
                    bird.vy = 0;
                }
                if (bird.y + BIRD_RADIUS > H - GROUND_HEIGHT) {
                    triggerGameOver();
                    return;
                }

                for (const p of pipes) {
                    const withinX = bird.x + BIRD_RADIUS > p.x && bird.x - BIRD_RADIUS < p.x + PIPE_WIDTH;
                    if (!withinX) continue;
                    const hitsTop = bird.y - BIRD_RADIUS < p.topHeight;
                    const hitsBottom = bird.y + BIRD_RADIUS > p.topHeight + PIPE_GAP;
                    if (hitsTop || hitsBottom) {
                        triggerGameOver();
                        return;
                    }
                }
            }

            let gameOverTriggered = false;
            function triggerGameOver() {
                if (gameOverTriggered) return;
                gameOverTriggered = true;
                running = false;
                gameOver();
            }

            const CONFIG = {
                ceu1: '#4ec0ca',
                ceu2: '#87ceeb',
                ceu3: '#ded895',
                cano1: '#5cb85c',
                cano2: '#7ed957',
                cano3: '#4a9e4a',
                canoTopo: '#6fdc6f',
                chao: '#6abe30'
            };

            function drawBackground() {
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, CONFIG.ceu1);
                grad.addColorStop(0.55, CONFIG.ceu2);
                grad.addColorStop(1, CONFIG.ceu3);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }

            function drawPipe(p) {
                const grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_WIDTH, 0);
                grad.addColorStop(0, MAP.cano3);
                grad.addColorStop(0.5, MAP.cano2);
                grad.addColorStop(1, MAP.cano1);

                // top pipe
                ctx.fillStyle = grad;
                ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topHeight);
                ctx.fillStyle = MAP.canoTopo;
                ctx.fillRect(p.x - 4, p.topHeight - 22, PIPE_WIDTH + 8, 22);

                // bottom pipe
                const bottomY = p.topHeight + PIPE_GAP;
                ctx.fillStyle = grad;
                ctx.fillRect(p.x, bottomY, PIPE_WIDTH, H - GROUND_HEIGHT - bottomY);
                ctx.fillStyle = MAP.canoTopo;
                ctx.fillRect(p.x - 4, bottomY, PIPE_WIDTH + 8, 22);
            }

            function drawGround() {
                ctx.fillStyle = MAP.chao;
                ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);
                ctx.fillStyle = 'rgba(0,0,0,.15)';
                for (let x = -groundOffset; x < W; x += 40) {
                    ctx.fillRect(x, H - GROUND_HEIGHT, 20, 8);
                }
            }

            function drawBird() {
                ctx.save();
                ctx.translate(bird.x, bird.y);
                ctx.rotate(bird.rot);
                const size = BIRD_RADIUS * 2.3;
                if (birdImg.complete && birdImg.naturalWidth > 0) {
                    ctx.drawImage(birdImg, -size / 2, -size / 2, size, size);
                } else {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(0, 0, BIRD_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function draw() {
                drawBackground();
                pipes.forEach(drawPipe);
                drawGround();
                drawBird();
            }

            function loop(now) {
                if (!running) return;
                const dt = Math.min(0.033, (now - lastTime) / 1000 || 0);
                lastTime = now;
                step(dt);
                draw();
                if (running) requestAnimationFrame(loop);
            }

            function start() {
                resize();
                reset();
                gameOverTriggered = false;
                running = true;
                lastTime = performance.now();
                requestAnimationFrame(loop);

                setTimeout(() => {
                    const hint = document.getElementById('tap-hint');
                    if (hint) hint.classList.add('hidden');
                }, 1800);
            }

            function stop() {
                running = false;
            }

            canvas.addEventListener('pointerdown', flap);
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    e.preventDefault();
                    flap();
                }
            });

            return {
                start, stop,
                get score() { return score; },
            };
        })();

        window.iniciarPartida = iniciarPartida;
        window.resgatar = resgatar;
        window.voltarParaAposta = voltarParaAposta;

        loadConfigs();
    })();
    </script>
</body>
